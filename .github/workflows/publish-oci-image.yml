name: Build & Publish Backend Images

on:
  workflow_dispatch:
    inputs:
      push_images:
        description: "Push images to registry?"
        required: true
        default: "false"
        type: choice
        options:
          - "true"
          - "false"
  push:
    branches:
      - fit_api
  pull_request:
    branches:
      - fit_api

env:
  REGISTRY: ghcr.io
  IMAGE_API: ${{ github.repository_owner }}/fit_api
  IMAGE_MIGRATE: ${{ github.repository_owner }}/fit_api_migrate

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in (only if pushing is enabled)
        if: ${{ github.event_name == 'push' || github.event.inputs.push_images == 'true' }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API image
        uses: docker/build-push-action@v5
        with:
          context: .
          target: api
          push: ${{ github.event_name == 'push' || github.event.inputs.push_images == 'true' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_API }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_API }}:${{ github.sha }}

      - name: Build migrate image
        uses: docker/build-push-action@v5
        with:
          context: .
          target: migrate
          push: ${{ github.event_name == 'push' || github.event.inputs.push_images == 'true' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_MIGRATE }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_MIGRATE }}:${{ github.sha }}
