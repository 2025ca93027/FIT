name: Build & Publish Backend Images

on:
  workflow_dispatch:
    inputs:
      push_images:
        description: "Push images to registry?"
        required: true
        default: "false"
        type: choice
        options:
          - "true"
          - "false"
  push:
    branches:
      - fit_api          # only push images when this branch is updated
  pull_request:
    branches:
      - fit_api          # build on PRs to ensure builds work

env:
  REGISTRY: ghcr.io
  IMAGE_API: 2025ca93027/fit_api
  IMAGE_MIGRATE: 2025ca93027/fit_api_migrate
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Log in (only if pushing)
        if: ${{ github.event.inputs.push_images == 'true' }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build API image
        uses: docker/build-push-action@v5
        with:
          context: .
          target: api
          push: ${{ github.event.inputs.push_images == 'true' }}
          tags: |
            ghcr.io/your-org/api:latest
            ghcr.io/your-org/api:${{ github.sha }}

      - name: Build migrate image
        uses: docker/build-push-action@v5
        with:
          context: .
          target: migrate
          push: ${{ github.event.inputs.push_images == 'true' }}
          tags: |
            ghcr.io/your-org/migrate:latest
            ghcr.io/your-org/migrate:${{ github.sha }}
